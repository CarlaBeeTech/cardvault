<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8a6025;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#c9954a;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1005;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0f0900;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- App icon background -->
  <rect width="100" height="100" rx="18" fill="url(#bgGrad)"/>

  <!-- Subtle border -->
  <rect width="100" height="100" rx="18" fill="none" stroke="#3d2e12" stroke-width="1.5"/>

  <!-- Back card (rotated, dark) -->
  <g transform="rotate(-9, 50, 57)">
    <rect x="14" y="38" width="72" height="46" rx="7" fill="#241808" stroke="#8a6025" stroke-width="1.5"/>
    <!-- subtle lines on back card -->
    <line x1="24" y1="56" x2="58" y2="56" stroke="#8a6025" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
    <line x1="24" y1="65" x2="48" y2="65" stroke="#8a6025" stroke-width="1.2" stroke-linecap="round" opacity="0.3"/>
  </g>

  <!-- Front card (slightly rotated, gold) -->
  <g transform="rotate(4, 50, 50)">
    <rect x="14" y="28" width="72" height="46" rx="7" fill="url(#goldGrad)"/>
    <!-- shine line across top of card -->
    <rect x="14" y="28" width="72" height="14" rx="7" fill="white" opacity="0.07"/>
    <rect x="14" y="35" width="72" height="7" fill="white" opacity="0.03"/>
    <!-- CV text -->
    <text
      x="50" y="56"
      text-anchor="middle"
      dominant-baseline="middle"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="26"
      font-weight="700"
      fill="#0f0900"
      letter-spacing="1"
    >CV</text>
    <!-- small decorative dot row -->
    <circle cx="30" cy="65" r="1.8" fill="#0f0900" opacity="0.3"/>
    <circle cx="37" cy="65" r="1.8" fill="#0f0900" opacity="0.3"/>
    <circle cx="44" cy="65" r="1.8" fill="#0f0900" opacity="0.3"/>
  </g>
</svg>
